name: BrainDocs ops (keep-alive, revenue, alerts)
on:
  # refreshed 2026-08-07 to pick up workflow_dispatch trigger
  schedule:
    - cron: '*/10 * * * *'   # keep-alive ping
    - cron: '45 8 * * *'     # daily revenue email
  workflow_dispatch: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BrainDocs and alert on failure
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.ADMIN_EMAIL }}
        run: |
          url="https://braindocs-7qqx.onrender.com/api/healthz"
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 45 "$url" || echo DOWN)
          if [ "$code" != "200" ]; then
            echo "$url cold-start retry..."
            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 45 "$url" || echo DOWN)
          fi
          echo "$url -> $code"
          if [ "$code" != "200" ]; then
            echo "DOWN: $url ($code)"
            export DOWN_VAR="$url($code)"
            if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && [ -n "$REPORT_TO" ]; then
              python3 - "$REPORT_TO" <<'PY'
import smtplib, os, sys
from email.mime.text import MIMEText
msg = MIMEText("Health check failed for: " + os.environ.get("DOWN_VAR", "unknown"))
msg["Subject"] = "DOWN ALERT: BrainDocs"
msg["From"] = os.environ["SMTP_USER"]
msg["To"] = sys.argv[1]
try:
    s = smtplib.SMTP("smtp.gmail.com", 587); s.starttls()
    s.login(os.environ["SMTP_USER"], os.environ["SMTP_PASS"]); s.send_message(msg); s.quit()
    print("alert sent")
except Exception as e:
    print("alert failed:", e)
PY
            fi
            exit 1
          fi

  ai-marketing:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '45 8 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/mkt-deps
          npm install --prefix /tmp/mkt-deps nodemailer --no-save --no-audit --no-fund
          npm install --prefix /tmp/mkt-deps helmet --no-save --no-audit --no-fund --silent || true
      - name: Social listening + daily hooks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: NODE_PATH=/tmp/mkt-deps/node_modules node scripts/social-listen.cjs

  abandoned-recovery:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '30 13 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/rec-deps
          npm install --prefix /tmp/rec-deps nodemailer --no-save --no-audit --no-fund
      - name: Send abandoned-checkout reminders
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: NODE_PATH=/tmp/rec-deps/node_modules node scripts/abandoned-recovery.cjs

  indexnow-submit:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '15 8 * * 1' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resubmit pSEO URLs to IndexNow
        run: node scripts/indexnow.cjs

  security-scan:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/sec-deps
          npm install --prefix /tmp/sec-deps nodemailer --no-save --no-audit --no-fund
      - name: Scan for leaked secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: NODE_PATH=/tmp/sec-deps/node_modules node scripts/security-scan.cjs || true

  revenue-report:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '45 8 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/revenue-deps
          npm install --prefix /tmp/revenue-deps nodemailer --no-save --no-audit --no-fund
      - name: Send daily revenue report
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.ADMIN_EMAIL }}
        run: NODE_PATH=/tmp/revenue-deps/node_modules node scripts/revenue-report.cjs
