name: Cloud Data Collect
on:
  schedule:
    - cron: "17 5 * * 1,3,5"   # Mon/Wed/Fri 05:17 UTC on cloud runners
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install node deps
        run: node --version && npm init -y >/dev/null 2>&1 || true
      - name: Collect world prospects (cloud runners, zero user data)
        run: |
          node outreach/collect-world.cjs --max 2500 || true
          node outreach/collect-prospects.cjs || true
          node outreach/clean-prospects.cjs || true
      - name: Commit new prospects
        run: |
          git config user.name "BrainAdvisor Bot"
          git config user.email "bot@brainadvisor.family"
          git add outreach/
          git diff --cached --quiet || git commit -m "cloud-collect: new prospects $(date -u +%F)"
          git push
