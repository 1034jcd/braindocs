name: Cloud Data Collect
on:
  schedule:
    - cron: "17 5 * * 1,4"   # Mon + Thu 05:17 UTC on cloud runners
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect + clean prospects (cloud, not user's wi-fi)
        run: |
          node outreach/collect-prospects.cjs || true
          node outreach/clean-prospects.cjs || true
      - name: Commit new prospects
        run: |
          git config user.name "BrainAdvisor Bot"
          git config user.email "bot@brainadvisor.family"
          git add outreach/prospects.csv outreach/collect-run.log 2>/dev/null || git add outreach/prospects.csv
          git diff --cached --quiet || git commit -m "cloud-collect: new prospects $(date -u +%F)"
          git push
