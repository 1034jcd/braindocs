name: BrainDocs ops (keep-alive, revenue, alerts)
on:
  # refreshed 2026-08-07 to pick up workflow_dispatch trigger
  schedule:
    - cron: '0 */6 * * *'    # keep-alive ping (every 6h; apps self-ping in-process)
    - cron: '45 8 * * *'     # daily revenue email
  workflow_dispatch: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping BrainDocs and alert on failure
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.ADMIN_EMAIL }}
        run: |
          fails=""
          for name_url in "braindocs:https://braindocs.cloudflare-family.workers.dev/" "brainadvisor:https://brainadvisor.cloudflare-family.workers.dev/" "brainapi:https://brainapi.cloudflare-family.workers.dev/" "brainb2b:https://brainb2b.cloudflare-family.workers.dev/" "mystic-cookie:https://mystic-cookie.cloudflare-family.workers.dev/" "braintrader:https://braintrader.cloudflare-family.workers.dev/"; do
            name="${name_url%%:*}"; url="${name_url#*:}"
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 45 "$url" || echo DOWN)
            for attempt in 2 3; do
              [ "$code" = "200" ] && break
              echo "$name attempt $attempt (backoff 20s)..."
              sleep 20
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 45 "$url" || echo DOWN)
            done
            echo "$name -> $code"
            [ "$code" != "200" ] && fails="$fails $name($code)"
          done
          if [ -n "$fails" ]; then
            echo "DOWN:$fails"
            export DOWN_VAR="Services down:$fails"
            if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && [ -n "$REPORT_TO" ]; then
              python3 .github/scripts/send-alert.py "$REPORT_TO"
            fi
            exit 1
          fi

  ai-marketing:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '45 8 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/mkt-deps
          npm install --no-save --no-audit --no-fund nodemailer
          npm install --no-save --no-audit --no-fund helmet --silent || true
      - name: Social listening + daily hooks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/social-listen.cjs

  abandoned-recovery:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '30 13 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/rec-deps
          npm install --no-save --no-audit --no-fund nodemailer
      - name: Send abandoned-checkout reminders
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/abandoned-recovery.cjs

  indexnow-submit:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '15 8 * * 1' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resubmit pSEO URLs to IndexNow
        run: node scripts/indexnow.cjs

  security-scan:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/sec-deps
          npm install --no-save --no-audit --no-fund nodemailer
      - name: Scan for leaked secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/security-scan.cjs || true

  revenue-report:
    runs-on: ubuntu-latest
    if: ${{ github.event.schedule == '45 8 * * *' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          mkdir -p /tmp/revenue-deps
          npm install --no-save --no-audit --no-fund nodemailer
      - name: Send daily revenue report
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.ADMIN_EMAIL }}
        run: node scripts/revenue-report.cjs
